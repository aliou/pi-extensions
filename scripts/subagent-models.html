<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Subagent model configurator</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --panel-2: #1d212b;
        --border: #2a2f3a;
        --text: #e6e9ef;
        --muted: #9aa3b2;
        --accent: #7c9cff;
        --accent-2: #57e3a0;
        --danger: #ff6b6b;
        --provider-anthropic: #d9a066;
        --provider-openai-codex: #74b9ff;
        --provider-synthetic: #a29bfe;
        --provider-neuralwatt: #55efc4;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.45 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
      }
      header .hint {
        color: var(--muted);
        font-size: 12px;
      }
      header .spacer {
        flex: 1;
      }
      button {
        font: inherit;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        color: #0b0d12;
        border-color: var(--accent);
        font-weight: 600;
      }
      main {
        flex: 1;
        overflow: auto;
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 0;
      }
      .palette {
        border-right: 1px solid var(--border);
        background: var(--panel);
        overflow-y: auto;
        padding: 12px;
      }
      .palette h2,
      .subagent h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin: 4px 0 10px;
      }
      .palette .search {
        width: 100%;
        margin-bottom: 10px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 7px 9px;
      }
      .palette .add-custom {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
        padding: 10px;
        border: 1px dashed var(--border);
        border-radius: 8px;
      }
      .palette .add-custom input {
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 6px 8px;
      }
      .card {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 8px;
        cursor: grab;
        user-select: none;
        transition:
          border-color 0.1s,
          transform 0.05s;
      }
      .card:active {
        cursor: grabbing;
      }
      .card.dragging {
        opacity: 0.4;
      }
      .card .prov {
        font-size: 11px;
        color: var(--muted);
      }
      .card .model {
        font-weight: 600;
        word-break: break-all;
      }
      .prov-tag {
        display: inline-block;
        font-size: 10px;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: 4px;
        margin-bottom: 3px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 14px;
        padding: 14px;
        align-content: start;
      }
      .subagent {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        min-height: 200px;
      }
      .subagent h2 {
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .subagent h2 .total {
        color: var(--muted);
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
        font-size: 11px;
      }
      .dropzone {
        flex: 1;
        border: 1px dashed transparent;
        border-radius: 8px;
        padding: 4px;
        min-height: 80px;
        transition:
          border-color 0.1s,
          background 0.1s;
      }
      .dropzone.over {
        border-color: var(--accent);
        background: rgba(124, 156, 255, 0.08);
      }
      .entry {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 7px;
        cursor: grab;
        user-select: none;
      }
      .entry:active {
        cursor: grabbing;
      }
      .entry.dragging {
        opacity: 0.4;
      }
      .entry .row1 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 7px;
      }
      .entry .grip {
        color: var(--muted);
        font-size: 14px;
      }
      .entry .model-name {
        flex: 1;
        font-weight: 600;
        word-break: break-all;
      }
      .entry .x {
        color: var(--muted);
        background: none;
        border: none;
        padding: 0 4px;
        font-size: 15px;
        line-height: 1;
      }
      .entry .x:hover {
        color: var(--danger);
      }
      .entry .row2 {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .entry label {
        color: var(--muted);
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .entry select,
      .entry input[type="number"] {
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 5px;
        padding: 3px 6px;
        font: inherit;
        width: 78px;
      }
      .entry input[type="number"] {
        width: 64px;
      }
      .placeholder {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        padding: 24px 8px;
      }
      .export {
        border-top: 1px solid var(--border);
        background: var(--panel);
        padding: 12px 18px;
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      .export.open {
        display: flex;
      }
      .export textarea {
        width: 100%;
        height: 180px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 10px;
        font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Subagent model configurator</h1>
      <span class="hint"
        >Drag models from the left into a subagent column. Reorder within a
        column by dragging. Edit thinking + weight inline. Export as JSON and
        paste it back.</span
      >
      <span class="spacer"></span>
      <button id="reset">Reset</button>
      <button id="export" class="primary">Export JSON</button>
    </header>

    <main>
      <aside class="palette">
        <h2>Model palette</h2>
        <input
          class="search"
          id="search"
          placeholder="filter models..."
          autocomplete="off"
        />
        <div class="add-custom">
          <input id="custom-prov" placeholder="provider (e.g. neuralwatt)" />
          <input id="custom-model" placeholder="model id" />
          <button id="custom-add">Add to palette</button>
        </div>
        <div id="palette-list"></div>
      </aside>

      <section class="grid" id="grid"></section>
    </main>

    <div class="export" id="export-panel">
      <textarea id="export-text" readonly></textarea>
      <div>
        <button id="copy">Copy to clipboard</button>
        <button id="import-btn">Import JSON</button>
        <button id="close-export">Close</button>
      </div>
    </div>

    <script>
      const SEED = {"subagents":{"artisan":[{"provider":"anthropic","model":"claude-opus-4-8","thinking":"medium","weight":1},{"provider":"synthetic","model":"hf:MiniMaxAI/MiniMax-M3","thinking":"medium","weight":1},{"provider":"neuralwatt","model":"kimi-k2.6","thinking":"medium","weight":1},{"provider":"neuralwatt","model":"qwen3.5-397b","thinking":"medium","weight":1},{"provider":"neuralwatt","model":"kimi-k2.7-code","thinking":"medium","weight":1}],"oracle":[{"provider":"openai-codex","model":"gpt-5.5","thinking":"medium","weight":1},{"provider":"anthropic","model":"claude-opus-4-8","thinking":"medium","weight":1},{"provider":"synthetic","model":"hf:MiniMaxAI/MiniMax-M3","thinking":"medium","weight":1},{"provider":"neuralwatt","model":"kimi-k2.7-code","thinking":"medium","weight":1},{"provider":"neuralwatt","model":"glm-5.1","thinking":"medium","weight":1},{"provider":"neuralwatt","model":"kimi-k2.6","thinking":"medium","weight":1}],"librarian":[{"provider":"neuralwatt","model":"kimi-k2.7-code","thinking":"medium","weight":1},{"provider":"synthetic","model":"hf:MiniMaxAI/MiniMax-M3","thinking":"medium","weight":1},{"provider":"synthetic","model":"hf:Qwen/Qwen3.5-397B-A17B","thinking":"medium","weight":1},{"provider":"neuralwatt","model":"kimi-k2.6","thinking":"medium","weight":1},{"provider":"neuralwatt","model":"qwen3.5-397b","thinking":"medium","weight":1}],"scout":[{"provider":"neuralwatt","model":"kimi-k2.7-code","thinking":"medium","weight":1},{"provider":"synthetic","model":"hf:moonshotai/Kimi-K2.6","thinking":"medium","weight":1},{"provider":"synthetic","model":"hf:Qwen/Qwen3.5-397B-A17B","thinking":"medium","weight":1},{"provider":"neuralwatt","model":"kimi-k2.6","thinking":"medium","weight":1},{"provider":"neuralwatt","model":"qwen3.5-397b","thinking":"medium","weight":1},{"provider":"openai-codex","model":"gpt-5.4-mini","thinking":"low","weight":1}],"reviewer":[{"provider":"neuralwatt","model":"kimi-k2.7-code","thinking":"medium","weight":1},{"provider":"synthetic","model":"hf:MiniMaxAI/MiniMax-M3","thinking":"medium","weight":1},{"provider":"anthropic","model":"claude-sonnet-4-6","thinking":"medium","weight":1},{"provider":"openai-codex","model":"gpt-5.5","thinking":"low","weight":1},{"provider":"neuralwatt","model":"qwen3.5-397b","thinking":"medium","weight":1}],"read-session":[{"provider":"synthetic","model":"hf:nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4","thinking":"off","weight":1},{"provider":"synthetic","model":"hf:zai-org/GLM-4.7-Flash","thinking":"off","weight":1},{"provider":"neuralwatt","model":"glm-5.2-fast","thinking":"off","weight":1},{"provider":"neuralwatt","model":"kimi-k2.6-fast","thinking":"off","weight":1},{"provider":"neuralwatt","model":"qwen3.5-397b","thinking":"medium","weight":1}],"look-at":[{"provider":"synthetic","model":"hf:moonshotai/Kimi-K2.6","thinking":"off","weight":1},{"provider":"neuralwatt","model":"kimi-k2.6-fast","thinking":"off","weight":1},{"provider":"neuralwatt","model":"qwen3.6-35b-fast","thinking":"off","weight":1},{"provider":"neuralwatt","model":"kimi-k2.7-code","thinking":"medium","weight":1},{"provider":"openai-codex","model":"gpt-5.4-mini","thinking":"off","weight":1}]},"palette":[{"provider":"anthropic","model":"claude-opus-4-8"},{"provider":"synthetic","model":"hf:MiniMaxAI/MiniMax-M3"},{"provider":"neuralwatt","model":"kimi-k2.6"},{"provider":"neuralwatt","model":"qwen3.5-397b"},{"provider":"neuralwatt","model":"kimi-k2.7-code"},{"provider":"openai-codex","model":"gpt-5.5"},{"provider":"neuralwatt","model":"glm-5.1"},{"provider":"synthetic","model":"hf:Qwen/Qwen3.5-397B-A17B"},{"provider":"synthetic","model":"hf:moonshotai/Kimi-K2.6"},{"provider":"openai-codex","model":"gpt-5.4-mini"},{"provider":"anthropic","model":"claude-sonnet-4-6"},{"provider":"synthetic","model":"hf:nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4"},{"provider":"synthetic","model":"hf:zai-org/GLM-4.7-Flash"},{"provider":"neuralwatt","model":"glm-5.2-fast"},{"provider":"neuralwatt","model":"kimi-k2.6-fast"},{"provider":"neuralwatt","model":"qwen3.6-35b-fast"}]}

      const THINKING_LEVELS = ["off", "low", "medium", "high", "xhigh"];

      const state = {
        palette: SEED.palette.map((p) => ({ ...p })),
        subagents: Object.fromEntries(
          Object.entries(SEED.subagents).map(([k, v]) => [
            k,
            v.map((e) => ({ ...e })),
          ]),
        ),
      };

      // drag payload: {kind: "palette"|"entry", ...}
      let dragPayload = null;

      function provColor(prov) {
        return `var(--provider-${prov})` || "var(--accent)";
      }
      function provTag(prov) {
        return `<span class="prov-tag" style="background:${provColor(
          prov,
        )}22;color:${provColor(prov)}">${escapeHtml(prov)}</span>`;
      }
      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function renderPalette() {
        const list = document.getElementById("palette-list");
        const q = document.getElementById("search").value.trim().toLowerCase();
        list.innerHTML = "";
        for (const p of state.palette) {
          const key = `${p.provider}/${p.model}`.toLowerCase();
          if (q && !key.includes(q)) continue;
          const card = document.createElement("div");
          card.className = "card";
          card.draggable = true;
          card.innerHTML = `${provTag(p.provider)}<div class="model">${escapeHtml(
            p.model,
          )}</div>`;
          card.addEventListener("dragstart", (e) => {
            dragPayload = { kind: "palette", provider: p.provider, model: p.model };
            card.classList.add("dragging");
            e.dataTransfer.effectAllowed = "copyMove";
          });
          card.addEventListener("dragend", () => {
            card.classList.remove("dragging");
            dragPayload = null;
            clearOver();
          });
          list.appendChild(card);
        }
        if (!list.children.length) {
          list.innerHTML = `<div class="placeholder">No models match.</div>`;
        }
      }

      function renderSubagents() {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        for (const [name, entries] of Object.entries(state.subagents)) {
          const col = document.createElement("div");
          col.className = "subagent";
          const total = entries.reduce((s, e) => s + Math.max(0, e.weight), 0);
          col.innerHTML = `<h2>${escapeHtml(name)} <span class="total">total weight ${total}</span></h2>`;
          const dz = document.createElement("div");
          dz.className = "dropzone";
          dz.dataset.subagent = name;

          if (entries.length === 0) {
            dz.innerHTML = `<div class="placeholder">Drop models here</div>`;
          }
          for (let i = 0; i < entries.length; i++) {
            dz.appendChild(renderEntry(name, entries[i], i));
          }

          dz.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = dragPayload?.kind === "entry" ? "move" : "copy";
            dz.classList.add("over");
          });
          dz.addEventListener("dragleave", (e) => {
            if (e.target === dz) dz.classList.remove("over");
          });
          dz.addEventListener("drop", (e) => {
            e.preventDefault();
            dz.classList.remove("over");
            if (!dragPayload) return;
            // append to end when dropped on the zone directly (not an entry)
            if (e.target === dz) {
              handleDrop(name, entries.length, dragPayload);
            }
          });

          col.appendChild(dz);
          grid.appendChild(col);
        }
      }

      function renderEntry(subagent, entry, index) {
        const el = document.createElement("div");
        el.className = "entry";
        el.draggable = true;
        el.innerHTML = `
          <div class="row1">
            <span class="grip">::</span>
            ${provTag(entry.provider)}
            <span class="model-name">${escapeHtml(entry.model)}</span>
            <button class="x" title="remove">&times;</button>
          </div>
          <div class="row2">
            <label>thinking
              <select>
                ${THINKING_LEVELS.map(
                  (t) =>
                    `<option value="${t}" ${t === entry.thinking ? "selected" : ""}>${t}</option>`,
                ).join("")}
              </select>
            </label>
            <label>weight
              <input type="number" min="0" step="0.1" value="${entry.weight}" />
            </label>
          </div>
        `;
        el.querySelector(".x").addEventListener("click", () => {
          state.subagents[subagent].splice(index, 1);
          renderAll();
        });
        el.querySelector("select").addEventListener("change", (e) => {
          entry.thinking = e.target.value;
        });
        el.querySelector('input[type="number"]').addEventListener(
          "input",
          (e) => {
            entry.weight = Number(e.target.value);
            updateTotals();
          },
        );

        el.addEventListener("dragstart", (e) => {
          dragPayload = {
            kind: "entry",
            from: subagent,
            index,
          };
          el.classList.add("dragging");
          e.dataTransfer.effectAllowed = "copyMove";
        });
        el.addEventListener("dragend", () => {
          el.classList.remove("dragging");
          dragPayload = null;
          clearOver();
        });
        el.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.stopPropagation();
          e.dataTransfer.dropEffect = dragPayload?.kind === "entry" ? "move" : "copy";
          el.style.borderColor = "var(--accent)";
        });
        el.addEventListener("dragleave", () => {
          el.style.borderColor = "";
        });
        el.addEventListener("drop", (e) => {
          e.preventDefault();
          e.stopPropagation();
          el.style.borderColor = "";
          if (!dragPayload) return;
          // insert before this entry
          const targetIndex = state.subagents[subagent].indexOf(entry);
          handleDrop(subagent, targetIndex, dragPayload);
        });
        return el;
      }

      function handleDrop(subagent, insertIndex, payload) {
        if (payload.kind === "palette") {
          state.subagents[subagent].splice(insertIndex, 0, {
            provider: payload.provider,
            model: payload.model,
            thinking: "medium",
            weight: 1,
          });
          renderAll();
        } else if (payload.kind === "entry") {
          const fromList = state.subagents[payload.from];
          const moved = fromList[payload.index];
          // remove from source
          fromList.splice(payload.index, 1);
          // adjust insert index if moving within same list and past the source
          if (payload.from === subagent && payload.index < insertIndex) {
            insertIndex -= 1;
          }
          state.subagents[subagent].splice(insertIndex, 0, moved);
          renderAll();
        }
      }

      function clearOver() {
        document
          .querySelectorAll(".dropzone.over")
          .forEach((el) => el.classList.remove("over"));
        document
          .querySelectorAll(".entry")
          .forEach((el) => (el.style.borderColor = ""));
      }

      function updateTotals() {
        for (const [name, entries] of Object.entries(state.subagents)) {
          const total = entries.reduce((s, e) => s + Math.max(0, e.weight), 0);
          const col = document.querySelector(
            `.subagent .dropzone[data-subagent="${name}"]`,
          )?.parentElement;
          const span = col?.querySelector(".total");
          if (span) span.textContent = `total weight ${total}`;
        }
      }

      function renderAll() {
        renderPalette();
        renderSubagents();
      }

      function exportJson() {
        const out = {};
        for (const [name, entries] of Object.entries(state.subagents)) {
          out[name] = entries.map((e) => ({
            provider: e.provider,
            model: e.model,
            thinking: e.thinking,
            weight: Number(e.weight) || 0,
          }));
        }
        return JSON.stringify(out, null, 2);
      }

      function importJson(text) {
        const parsed = JSON.parse(text);
        const newSubs = {};
        for (const [name, list] of Object.entries(parsed)) {
          if (!Array.isArray(list)) throw new Error(`${name} is not an array`);
          newSubs[name] = list.map((e) => ({
            provider: String(e.provider),
            model: String(e.model),
            thinking: THINKING_LEVELS.includes(e.thinking) ? e.thinking : "medium",
            weight: Number(e.weight) || 0,
          }));
          // ensure palette has these models
          for (const e of newSubs[name]) {
            if (!state.palette.some((p) => p.provider === e.provider && p.model === e.model)) {
              state.palette.push({ provider: e.provider, model: e.model });
            }
          }
        }
        state.subagents = newSubs;
        renderAll();
      }

      document.getElementById("search").addEventListener("input", renderPalette);
      document.getElementById("custom-add").addEventListener("click", () => {
        const prov = document.getElementById("custom-prov").value.trim();
        const model = document.getElementById("custom-model").value.trim();
        if (!prov || !model) return;
        if (!state.palette.some((p) => p.provider === prov && p.model === model)) {
          state.palette.push({ provider: prov, model });
          renderPalette();
        }
        document.getElementById("custom-prov").value = "";
        document.getElementById("custom-model").value = "";
      });
      document.getElementById("reset").addEventListener("click", () => {
        if (!confirm("Reset to seed rosters?")) return;
        state.palette = SEED.palette.map((p) => ({ ...p }));
        state.subagents = Object.fromEntries(
          Object.entries(SEED.subagents).map(([k, v]) => [k, v.map((e) => ({ ...e }))]),
        );
        renderAll();
      });
      document.getElementById("export").addEventListener("click", () => {
        const panel = document.getElementById("export-panel");
        document.getElementById("export-text").value = exportJson();
        panel.classList.add("open");
      });
      document.getElementById("close-export").addEventListener("click", () => {
        document.getElementById("export-panel").classList.remove("open");
      });
      document.getElementById("copy").addEventListener("click", async () => {
        await navigator.clipboard.writeText(
          document.getElementById("export-text").value,
        );
        const b = document.getElementById("copy");
        const old = b.textContent;
        b.textContent = "Copied!";
        setTimeout(() => (b.textContent = old), 1200);
      });
      document.getElementById("import-btn").addEventListener("click", () => {
        const text = prompt("Paste exported JSON to import:");
        if (!text) return;
        try {
          importJson(text);
        } catch (err) {
          alert("Import failed: " + err.message);
        }
      });

      renderAll();
    </script>
  </body>
</html>
